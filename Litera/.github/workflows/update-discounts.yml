name: Update discount books

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-discounts.yml"
      - "Litera/.github/updateDiscounts.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-discount-books:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Litera/.github

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Litera/.github/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update discount books
        run: node updateDiscounts.js
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
